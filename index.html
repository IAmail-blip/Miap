<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#F0F7FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="autocomplete" content="off">
<title>Mi Agenda</title>
<link rel="manifest" id="pwa-manifest">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F7FF;--surf:#fff;--surf2:#F5FAFE;--surf3:#E8F4FF;
  --border:#BDD9F7;--blue:#0070F3;--blue-lt:#EBF5FF;--sky:#38BDF8;
  --teal:#0891B2;--teal-lt:#CFFAFE;--amber:#D97706;--amber-lt:#FEF3C7;
  --rose:#E11D48;--rose-lt:#FFE4E6;--purple:#7C3AED;--purple-lt:#EDE9FE;
  --green:#059669;--green-lt:#D1FAE5;
  --text:#0A1628;--text2:#1E3A5F;--text3:#6B8FB8;
  --r:16px;--r-sm:10px;--nav-h:66px;--top-h:58px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif;overflow:hidden;}

/* SPLASH */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(160deg,#0052CC 0%,#0070F3 50%,#38BDF8 100%);padding:32px 24px;text-align:center;}
.splash-logo{font-size:56px;margin-bottom:12px;}
.splash-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:32px;color:#fff;margin-bottom:6px;}
.splash-sub{font-size:14px;color:rgba(255,255,255,.75);max-width:260px;line-height:1.5;margin-bottom:20px;}
.splash-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 20px;max-width:280px;}
.splash-ico{width:54px;height:54px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.35);
  border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.splash-btn{background:#fff;color:#0070F3;border:none;border-radius:50px;
  padding:14px 40px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;cursor:pointer;}
#installBtn{display:none;margin-top:12px;background:rgba(255,255,255,.2);color:#fff;
  border:1.5px solid rgba(255,255,255,.5);border-radius:50px;padding:11px 32px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}

/* APP */
#app{display:none;flex-direction:column;height:100vh;height:100dvh;}

/* TOPBAR */
.topbar{height:var(--top-h);background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:10;}
.topbar-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:17px;color:var(--text);}
.topbar-date{font-size:11px;color:var(--text3);margin-top:1px;}
.top-btns{display:flex;gap:6px;align-items:center;}
.top-btn{background:var(--blue-lt);color:var(--blue);border:1px solid var(--border);border-radius:20px;
  padding:6px 11px;font-size:11.5px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;}

/* SCROLL */
#scrollArea{flex:1;overflow-y:auto;padding:12px 12px 80px;-webkit-overflow-scrolling:touch;}

/* SECTIONS */
.section{display:none;}
.section.active{display:block;}

/* NAV */
.bottom-nav{height:var(--nav-h);background:var(--surf);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;
  border:none;background:transparent;cursor:pointer;position:relative;min-width:52px;}
.nav-ico{font-size:22px;line-height:1;}
.nav-lbl{font-size:10px;font-weight:700;color:var(--text3);font-family:'Nunito',sans-serif;}
.nav-btn.active .nav-lbl{color:var(--blue);}
.nav-pill{position:absolute;top:4px;right:8px;min-width:16px;height:16px;background:var(--rose);
  border-radius:8px;font-size:9px;font-weight:700;color:#fff;display:none;align-items:center;justify-content:center;padding:0 3px;}
.nav-pill.show{display:flex;}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));right:16px;
  width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--sky));
  color:#fff;font-size:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,112,243,.4);z-index:49;}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.card-title{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--text2);margin-bottom:12px;}
.ct-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin-bottom:10px;}
.stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 6px;text-align:center;}
.stat-val{font-family:'Nunito',sans-serif;font-weight:800;font-size:22px;color:var(--blue);}
.stat-lbl{font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

/* ITEMS */
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surf);
  border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;}
.item.done{opacity:.55;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:11.5px;color:var(--text3);margin-top:2px;}
.item-actions{display:flex;gap:4px;flex-shrink:0;}
.ibtn{width:30px;height:30px;border:none;background:var(--surf2);border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}

/* CHECKLIST */
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700;flex-shrink:0;}
.chk.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* PROGRESS */
.prog{height:6px;background:var(--surf3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));border-radius:3px;transition:width .4s;}
.noche-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surf);
  border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:10px;}
.noche-pct{font-family:'Nunito',sans-serif;font-weight:800;font-size:22px;color:var(--blue);min-width:44px;}
.noche-bar-lbl{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:4px;}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surf);
  font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.sub-panel{display:none;}
.sub-panel.on{display:block;}

/* DATE BLOCK */
.date-block{min-width:46px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.db-day{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;line-height:1;}
.db-mon{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}

/* TRIP */
.trip-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:8px;}
.trip-head{display:flex;align-items:center;gap:10px;}
.trip-date{min-width:36px;text-align:center;}
.td{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;color:var(--blue);}
.tw{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;}
.trip-name{font-size:14px;font-weight:700;color:var(--text);}
.trip-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}

/* TAGS */
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;}
.tb{background:var(--blue-lt);color:var(--blue);}
.ts{background:var(--surf3);color:var(--text3);}
.tt{background:var(--teal-lt);color:var(--teal);}
.ta{background:var(--amber-lt);color:var(--amber);}
.tr{background:var(--rose-lt);color:var(--rose);}
.tgr{background:var(--green-lt);color:var(--green);}
.tp{background:var(--purple-lt);color:var(--purple);}

/* TEMAS */
.topic{border-left:3px solid var(--border);}
.topic.pending{border-left-color:var(--text3);}
.topic.studying{border-left-color:var(--amber);}
.topic.done{border-left-color:var(--green);}
.status-sel{font-size:11px;padding:4px 6px;border:1px solid var(--border);border-radius:8px;
  background:var(--surf2);color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:var(--text3);}
.empty-ico{font-size:36px;margin-bottom:8px;}
.empty p{font-size:13px;font-weight:600;}

/* SEC HEADER */
.sec-h{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 2px 6px;font-family:'Nunito',sans-serif;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,22,40,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:520px;
  padding:20px 18px 32px;max-height:88dvh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:17px;color:var(--text);margin-bottom:16px;}

/* FORM */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11.5px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px;font-family:'Nunito',sans-serif;}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;font-family:'Nunito Sans',sans-serif;color:var(--text);background:var(--surf);outline:none;}
.fi:focus{border-color:var(--blue);}
.fs{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;font-family:'Nunito Sans',sans-serif;color:var(--text);background:var(--surf);outline:none;}
.fta{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;font-family:'Nunito Sans',sans-serif;color:var(--text);background:var(--surf);outline:none;resize:none;min-height:80px;}
.frow{display:flex;gap:10px;}
.frow .fg{flex:1;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn{padding:12px 20px;border-radius:var(--r-sm);font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;flex:1;border:none;}
.btn-save{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;}
.btn-cancel{background:var(--surf2);color:var(--text3);border:1px solid var(--border);}

/* ICO GRID */
.ico-grid{display:flex;flex-wrap:wrap;gap:2px;padding:8px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-sm);max-height:160px;overflow-y:auto;}
.ico-btn{font-size:22px;padding:5px;border-radius:8px;border:2px solid transparent;background:transparent;cursor:pointer;}
.ico-btn.sel{border-color:var(--blue);background:var(--blue-lt);}

/* STOCK */
.stock-out{font-size:11px;font-weight:700;color:var(--rose);background:var(--rose-lt);padding:2px 7px;border-radius:10px;}
.stock-ok{font-size:11px;font-weight:700;color:var(--green);background:var(--green-lt);padding:2px 7px;border-radius:10px;}

/* NOTAS */
.nota-card{border-left:4px solid var(--blue);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;}
.nota-card.amber{border-left-color:var(--amber);background:var(--amber-lt);}
.nota-card.teal{border-left-color:var(--teal);background:var(--teal-lt);}
.nota-card.rose{border-left-color:var(--rose);background:var(--rose-lt);}
.nota-card.purple{border-left-color:var(--purple);background:var(--purple-lt);}
.nota-card.blue{border-left-color:var(--blue);background:var(--blue-lt);}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1E3A5F;color:#fff;
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:200;opacity:0;
  transition:opacity .3s;white-space:nowrap;pointer-events:none;}

/* EXIT MODAL */
#exitOverlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,.55);z-index:300;align-items:center;justify-content:center;padding:24px;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">📋</div>
  <div class="splash-title">Mi Agenda</div>
  <div class="splash-sub">Tu gestor personal todo en uno</div>
  <div class="splash-icons">
    <div class="splash-ico">🚂</div>
    <div class="splash-ico">🌅</div>
    <div class="splash-ico">🌙</div>
    <div class="splash-ico">🗓️</div>
    <div class="splash-ico">📚</div>
    <div class="splash-ico">🏥</div>
    <div class="splash-ico">🛒</div>
    <div class="splash-ico">📝</div>
  </div>
  <button class="splash-btn" onclick="enterApp()">Entrar →</button>
  <button id="installBtn" onclick="installApp()">📲 Instalar en pantalla de inicio</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarDatos(event)">
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="topTitle">Resumen</div>
      <div class="topbar-date" id="topDate"></div>
    </div>
    <div class="top-btns">
      <button class="top-btn" id="btnReiniciar" style="display:none">↺ Reiniciar</button>
      <button class="top-btn" onclick="goSplash()">🏠 Inicio</button>
      <button class="top-btn" id="btnBackup" style="display:none" onclick="openBackup()">🗄️ Backup</button>
    </div>
  </div>

  <div id="scrollArea">
    <div class="section active" id="sec-overview">
      <div class="stats-grid" id="ov-stats"></div>
      <div id="ov-body"></div>
    </div>
    <div class="section" id="sec-transport">
      <div class="tabs">
        <button class="tab on" onclick="stab(this,'tr-prox')">Próximos</button>
        <button class="tab" onclick="stab(this,'tr-hist')">Historial</button>
      </div>
      <div class="sub-panel on" id="tr-prox"></div>
      <div class="sub-panel" id="tr-hist"></div>
    </div>
    <div class="section" id="sec-manana">
      <div class="noche-bar">
        <div class="noche-pct" id="manana-pct">0%</div>
        <div style="flex:1">
          <div class="noche-bar-lbl">Checklist completado</div>
          <div class="prog"><div class="prog-fill" id="manana-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div id="manana-list"></div>
    </div>
    <div class="section" id="sec-noche">
      <div class="noche-bar">
        <div class="noche-pct" id="noche-pct">0%</div>
        <div style="flex:1">
          <div class="noche-bar-lbl">Checklist completado</div>
          <div class="prog"><div class="prog-fill" id="noche-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div id="noche-list"></div>
    </div>
    <div class="section" id="sec-eventos"><div id="eventos-list"></div></div>
    <div class="section" id="sec-temas">
      <div class="tabs">
        <button class="tab on" onclick="stab(this,'tm-all')" style="padding:6px 9px;font-size:11.5px">Todos</button>
        <button class="tab" onclick="stab(this,'tm-pend')" style="padding:6px 9px;font-size:11.5px">Pendiente</button>
        <button class="tab" onclick="stab(this,'tm-stud')" style="padding:6px 9px;font-size:11.5px">Estudiando</button>
        <button class="tab" onclick="stab(this,'tm-done')" style="padding:6px 9px;font-size:11.5px">Hecho</button>
        <button class="tab" onclick="stab(this,'tm-stats')" style="padding:6px 9px;font-size:11.5px">📊</button>
      </div>
      <div class="sub-panel on" id="tm-all"></div>
      <div class="sub-panel" id="tm-pend"></div>
      <div class="sub-panel" id="tm-stud"></div>
      <div class="sub-panel" id="tm-done"></div>
      <div class="sub-panel" id="tm-stats"></div>
    </div>
    <div class="section" id="sec-citas"><div id="citas-list"></div></div>
    <div class="section" id="sec-compras">
      <div class="tabs">
        <button class="tab on" onclick="stab(this,'cp-med')">💊 Farmacia</button>
        <button class="tab" onclick="stab(this,'cp-aseo')">🧴 Perfumería</button>
        <button class="tab" onclick="stab(this,'cp-var')">🛒 Varios</button>
      </div>
      <div class="sub-panel on" id="cp-med"></div>
      <div class="sub-panel" id="cp-aseo"></div>
      <div class="sub-panel" id="cp-var"></div>
    </div>
    <div class="section" id="sec-notas"><div id="notas-list"></div></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-sec="overview" onclick="go('overview')">
      <span class="nav-ico">◈</span><span class="nav-lbl">Resumen</span>
    </button>
    <button class="nav-btn" data-sec="transport" onclick="go('transport')">
      <span class="nav-ico">🚂</span><span class="nav-lbl">Viajes</span>
    </button>
    <button class="nav-btn" data-sec="manana" onclick="go('manana')">
      <span class="nav-ico">🌅</span><span class="nav-lbl">Mañana</span>
      <span class="nav-pill" id="dot-manana"></span>
    </button>
    <button class="nav-btn" data-sec="noche" onclick="go('noche')">
      <span class="nav-ico">🌙</span><span class="nav-lbl">Noche</span>
      <span class="nav-pill" id="dot-noche"></span>
    </button>
    <button class="nav-btn" data-sec="more" onclick="openMore()">
      <span class="nav-ico">⋯</span><span class="nav-lbl">Más</span>
    </button>
  </nav>
</div>

<button class="fab" id="fab" onclick="openAdd()" style="display:none">＋</button>

<!-- MORE -->
<div class="overlay" id="moreOverlay" onclick="if(event.target===this)closeMore()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Más secciones</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px">
      <button class="btn btn-cancel" style="text-align:left;padding:14px 16px;font-size:15px" onclick="closeMore();go('eventos')">🗓️  Eventos</button>
      <button class="btn btn-cancel" style="text-align:left;padding:14px 16px;font-size:15px" onclick="closeMore();go('temas')">📚  Temas de estudio</button>
      <button class="btn btn-cancel" style="text-align:left;padding:14px 16px;font-size:15px" onclick="closeMore();go('citas')">🏥  Citas médicas</button>
      <button class="btn btn-cancel" style="text-align:left;padding:14px 16px;font-size:15px" onclick="closeMore();go('compras')">🛒  Compras</button>
      <button class="btn btn-cancel" style="text-align:left;padding:14px 16px;font-size:15px" onclick="closeMore();go('notas')">📝  Notas rápidas</button>
      <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:12px">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0">
          <input type="checkbox" id="soundToggle" checked onchange="setSoundEnabled(this.checked)" style="width:18px;height:18px;accent-color:var(--blue)">
          <span style="font-size:14px;font-weight:600;color:var(--text)">🔊 Sonidos activados</span>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- BACKUP -->
<div class="overlay" id="backupOverlay" onclick="if(event.target===this)closeBackup()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <div class="ct-ico" style="background:var(--blue-lt);width:38px;height:38px;border-radius:12px;font-size:20px">🗄️</div>

function newDB() {
  return {
    transport:[], plantillas:[],
    noche:JSON.parse(JSON.stringify(DEF_NOCHE)),
    manana:JSON.parse(JSON.stringify(DEF_MANANA)),
    noche_deleted:[], manana_deleted:[],
    eventos:[], temas:[], citas:[],
    medicinas:[], aseo:[], varios:[],
    notas:[]
  };
}

function loadDB() {
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) {
      var d = JSON.parse(raw);
      // ensure all keys
      if (!d.plantillas) d.plantillas = [];
      if (!d.noche_deleted) d.noche_deleted = [];
      if (!d.manana_deleted) d.manana_deleted = [];
      if (!d.eventos) d.eventos = [];
      if (!d.temas) d.temas = [];
      if (!d.citas) d.citas = [];
      if (!d.medicinas) d.medicinas = [];
      if (!d.aseo) d.aseo = [];
      if (!d.varios) d.varios = [];
      if (!d.notas) d.notas = [];
      if (!d.transport) d.transport = [];
      if (!d.noche) d.noche = JSON.parse(JSON.stringify(DEF_NOCHE));
      if (!d.manana) d.manana = JSON.parse(JSON.stringify(DEF_MANANA));
      // restore default checklist items not manually deleted
      DEF_NOCHE.forEach(function(def) {
        var deleted = d.noche_deleted.indexOf(def.id) >= 0;
        if (!deleted && !d.noche.find(function(n){ return n.id === def.id; }))
          d.noche.push(JSON.parse(JSON.stringify(def)));
      });
      DEF_MANANA.forEach(function(def) {
        var deleted = d.manana_deleted.indexOf(def.id) >= 0;
        if (!deleted && !d.manana.find(function(n){ return n.id === def.id; }))
          d.manana.push(JSON.parse(JSON.stringify(def)));
      });
      return d;
    }
    // migrate from older versions
    var old = localStorage.getItem('ag5_db') || localStorage.getItem('ag4_db');
    if (old) {
      var od = JSON.parse(old);
      var nd = newDB();
      nd.transport = od.transport || [];
      nd.plantillas = od.plantillas || [];
      nd.eventos = od.eventos || od.examenes || [];
      nd.temas = od.temas || [];
      nd.citas = od.citas || [];
      nd.medicinas = od.medicinas || [];
      nd.aseo = od.aseo || [];
      nd.varios = od.varios || [];
      nd.notas = od.notas || [];
      return nd;
    }
  } catch(e) { console.log('loadDB error:', e); }
  return newDB();
}

var DB = loadDB();

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify(DB));

// ═══ DATE HELPERS ═══
var DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MONS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MONSU = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function safeDate(s) {
  if (!s) return null;
  var d;
  if (s.indexOf('T') > -1) {
    d = new Date(s);
  } else {
    var p = s.split('-');
    if (p.length !== 3) return null;
    d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]), 12, 0, 0);
  }
  return isNaN(d.getTime()) ? null : d;
}

function hoy() {
  var h = new Date(); h.setHours(0,0,0,0); return h;
}

function diasHasta(s) {
  var d = safeDate(s); if (!d) return 0;
  return Math.round((d - hoy()) / 864e5);
}

function fmtDate(s) {
  var d = safeDate(s); if (!d) return '';
  return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONS[d.getMonth()];
}

function mon(d) { return MONSU[d.getMonth()]; }
function dow(d) { return DAYS[d.getDay()]; }

// ═══ SOUNDS ═══
var soundEnabled = true;
function setSoundEnabled(v) { soundEnabled = v; }

function playSound(type) {
  if (!soundEnabled) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'check') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime+0.08);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.18);
      osc.start(); osc.stop(ctx.currentTime+0.18);
    } else if (type === 'save') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.setValueAtTime(900, ctx.currentTime+0.08);
      osc.frequency.setValueAtTime(1200, ctx.currentTime+0.16);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
      osc.start(); osc.stop(ctx.currentTime+0.3);
    } else if (type === 'delete') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime+0.2);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.2);
      osc.start(); osc.stop(ctx.currentTime+0.2);
    } else if (type === 'nav') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime+0.06);
      gain.gain.setValueAtTime(0.07, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.1);
      osc.start(); osc.stop(ctx.currentTime+0.1);
    }
  } catch(e) {}
}

// ═══ OVERVIEW ═══
function renderOverview() {
  var h = hoy();
  var upcoming = DB.transport.filter(function(t){
    var d = safeDate(t.date); return d && d >= h;
  }).sort(function(a,b){ return (safeDate(a.date)||0)-(safeDate(b.date)||0); });

  var tAll = DB.temas.length;
  var tDone = DB.temas.filter(function(t){ return t.status==='done'; }).length;
  var allProds = DB.medicinas.concat(DB.aseo).concat(DB.varios);
  var pendProds = allProds.filter(function(m){ return m.pendiente===true; }).length;

  var proxEvs = getEventosProximos();
  var proxCitas = DB.citas.filter(function(c){ var d=safeDate(c.date); return d && d>=h; });
  proxCitas.sort(function(a,b){ return (safeDate(a.date)||0)-(safeDate(b.date)||0); });

  var mDone = DB.manana.filter(function(n){ return n.done; }).length;
  var nDone = DB.noche.filter(function(n){ return n.done; }).length;

  // Stats
  var stats = '';
  stats += '<div class="stat"><div class="stat-val">' + upcoming.length + '</div><div class="stat-lbl">Viajes</div></div>';
  stats += '<div class="stat"><div class="stat-val" style="color:var(--amber)">' + (DB.manana.length - mDone) + '</div><div class="stat-lbl">Día</div></div>';
  stats += '<div class="stat"><div class="stat-val" style="color:var(--purple)">' + (DB.noche.length - nDone) + '</div><div class="stat-lbl">Noche</div></div>';
  stats += '<div class="stat"><div class="stat-val" style="color:var(--teal)">' + proxEvs.length + '</div><div class="stat-lbl">Eventos</div></div>';
  stats += '<div class="stat"><div class="stat-val">' + (tAll>0?Math.round(tDone/tAll*100):0) + '%</div><div class="stat-lbl">Estudio</div></div>';
  stats += '<div class="stat"><div class="stat-val" style="color:var(--teal)">' + proxCitas.length + '</div><div class="stat-lbl">Citas</div></div>';
  stats += '<div class="stat"><div class="stat-val" style="color:' + (pendProds>0?'var(--rose)':'var(--green)') + '">' + pendProds + '</div><div class="stat-lbl">Cesta</div></div>';
  document.getElementById('ov-stats').innerHTML = stats;

var CAT_ICONS = {Cumpleaños:'🎂',Examen:'📝',Coche:'🚗',Pago:'💶',Revisión:'🔧',Otro:'📌'};
function iconForCat(cat) { return CAT_ICONS[cat] || '📅'; }

function getEventosProximos() {
  var h = hoy();
  var res = [];
  DB.eventos.forEach(function(e) {
    if (!e.recurrencia) {
      var d = safeDate(e.date);
      if (d && d >= h) res.push(e);
      return;
    }
    var base = safeDate(e.date); if (!base) return;
    var next = new Date(base);
    while (next < h) {
      if (e.recurrencia==='diaria') next.setDate(next.getDate()+1);
      else if (e.recurrencia==='semanal') next.setDate(next.getDate()+7);
      else if (e.recurrencia==='mensual') next.setMonth(next.getMonth()+1);
      else if (e.recurrencia==='anual') next.setFullYear(next.getFullYear()+1);
      else break;
    }
    var copy = JSON.parse(JSON.stringify(e));
    copy.date = next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0') + '-' + String(next.getDate()).padStart(2,'0');
    copy._rec = true;
    res.push(copy);
  });
  res.sort(function(a,b){ return (safeDate(a.date)||0)-(safeDate(b.date)||0); });
  return res;
}

function renderEstadisticas() {
  var el = document.getElementById('tm-stats'); if (!el) return;
  var total = DB.temas.length;
  if (!total) { el.innerHTML='<div class="empty"><div class="empty-ico">📊</div><p>Añade temas para ver estadísticas</p></div>'; return; }
  var done = DB.temas.filter(function(t){ return t.status==='done'; }).length;
  var studying = DB.temas.filter(function(t){ return t.status==='studying'; }).length;
  var pending = DB.temas.filter(function(t){ return t.status==='pending'; }).length;
  var pct = Math.round(done/total*100);
  var groups = {};
  DB.temas.forEach(function(t){ var k=t.asignatura||'Sin asignatura'; if(!groups[k])groups[k]={done:0,studying:0,pending:0,total:0}; groups[k].total++; groups[k][t.status]++; });
  var h = '<div style="background:linear-gradient(135deg,var(--blue),var(--sky));border-radius:var(--r);padding:20px;margin-bottom:14px;color:#fff">';
  h += '<div style="font-size:13px;font-weight:600;opacity:.85;margin-bottom:4px">Progreso total</div>';
  h += '<div style="font-family:Nunito,sans-serif;font-weight:800;font-size:48px;line-height:1">' + pct + '%</div>';
  h += '<div style="font-size:12px;opacity:.85;margin-top:4px">' + done + ' de ' + total + ' temas completados</div>';
  h += '<div style="height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:14px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:#fff;border-radius:3px"></div></div></div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">';
  h += '<div style="background:var(--green-lt);border:1px solid var(--green);border-radius:var(--r-sm);padding:12px;text-align:center"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:24px;color:var(--green)">' + done + '</div><div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;margin-top:2px">Hechos</div></div>';
  h += '<div style="background:var(--amber-lt);border:1px solid var(--amber);border-radius:var(--r-sm);padding:12px;text-align:center"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:24px;color:var(--amber)">' + studying + '</div><div style="font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;margin-top:2px">Estudiando</div></div>';
  h += '<div style="background:var(--rose-lt);border:1px solid var(--rose);border-radius:var(--r-sm);padding:12px;text-align:center"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:24px;color:var(--rose)">' + pending + '</div><div style="font-size:10px;font-weight:700;color:var(--rose);text-transform:uppercase;margin-top:2px">Pendientes</div></div>';
  h += '</div>';
  h += '<div class="sec-h">Por asignatura</div>';
  Object.keys(groups).sort(function(a,b){ return (groups[b].done/groups[b].total)-(groups[a].done/groups[a].total); }).forEach(function(asig) {
    var gg = groups[asig]; var ap = Math.round(gg.done/gg.total*100);
    h += '<div style="background:var(--surf);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px;margin-bottom:8px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">';
    h += '<div style="font-size:13px;font-weight:700">' + asig + '</div><div style="font-size:12px;font-weight:700;color:var(--blue)">' + ap + '%</div></div>';
    h += '<div class="prog" style="margin-bottom:7px"><div class="prog-fill" style="width:' + ap + '%"></div></div>';

    if (gg.studying) h += '<span class="tag ta">📖 ' + gg.studying + '</span>';
    if (gg.pending) h += '<span class="tag tr">◯ ' + gg.pending + '</span>';
    h += '<span class="tag tb">' + gg.total + ' total</span></div></div>';
  });
  el.innerHTML = h;
}

// ═══ CITAS ═══
function renderCitas() {
  var h = hoy();
  var sorted = DB.citas.slice().sort(function(a,b){ return (safeDate(a.date)||0)-(safeDate(b.date)||0); });
  var up = sorted.filter(function(c){ var d=safeDate(c.date); return d && d>=h; });
  var past = sorted.filter(function(c){ var d=safeDate(c.date); return !d || d<h; });
  var el = document.getElementById('citas-list'); if (!el) return;
  if (!sorted.length) { el.innerHTML='<div class="empty"><div class="empty-ico">🏥</div><p>Sin citas registradas</p></div>'; return; }
  var html = '';
  if (up.length) { html += '<div class="sec-h">Próximas</div>'; up.forEach(function(c){ html += citaRow(c, false); }); }
  if (past.length) { html += '<div class="sec-h">Pasadas</div>'; past.forEach(function(c){ html += citaRow(c, true); }); }
  el.innerHTML = html;
}
function citaRow(c, past) {
  var d = safeDate(c.date);
  var dl = diasHasta(c.date);
  var row = '<div class="item" style="' + (past?'opacity:.6':'') + '">';
  row += '<div class="date-block" style="background:' + (past?'var(--surf3)':'linear-gradient(135deg,var(--teal),#00A896)') + ';color:' + (past?'var(--text3)':'#fff') + '">';
  row += '<div class="db-day">' + (d?d.getDate():'--') + '</div><div class="db-mon">' + (d?mon(d):'---') + '</div></div>';
  row += '<div class="item-main"><div class="item-title">' + c.especialidad + '</div>';
  if (c.medico) row += '<div class="item-sub">👨‍⚕️ ' + c.medico + (c.lugar?' · 📍'+c.lugar:'') + '</div>';
  if (!past) row += '<div style="margin-top:5px"><span class="tag ' + (dl<=3?'tr':dl<=14?'ta':'tt') + '">' + (dl<=0?'¡Hoy!':dl===1?'Mañana':'En '+dl+' días') + '</span></div>';
  if (c.notas) row += '<div style="font-size:11.5px;color:var(--text3);margin-top:3px;font-style:italic">' + c.notas + '</div>';
  row += '</div>';
  row += '<div class="item-actions">';
  row += '<button class="ibtn" data-edit="cita" data-eid="' + c.id + '">✏️</button>';
  row += '<button class="ibtn" data-del="citas" data-did="' + c.id + '">🗑️</button>';
  row += '</div></div>';
  return row;
}

// ═══ COMPRAS ═══
function comprasKey(pid) {
  if (pid==='cp-aseo') return 'aseo';
  if (pid==='cp-var') return 'varios';
  return 'medicinas';
}
function comprasDefIco(key) {
  if (key==='aseo') return '🧴';
  if (key==='varios') return '🛒';
  return '💊';
}
function renderCompras(pid) {
  var key = comprasKey(pid);
  var defIco = comprasDefIco(key);
  var el = document.getElementById(pid); if (!el) return;
  var list = DB[key] || [];
  if (!list.length) { el.innerHTML='<div class="empty"><div class="empty-ico">' + defIco + '</div><p>Sin productos. Pulsa ＋ para añadir</p></div>'; return; }
  var rows = '';
  list.forEach(function(m) {
    rows += '<div class="item">';
    rows += '<span style="font-size:26px">' + (m.icon||defIco) + '</span>';
    rows += '<div class="item-main"><div class="item-title">' + m.nombre + '</div>';
    if (m.dosis) rows += '<div class="item-sub">' + m.dosis + (m.notas?' · '+m.notas:'') + '</div>';
    if (m.pendiente) rows += '<span class="stock-out" data-pkey="' + key + '" data-pid="' + m.id + '" style="margin-top:5px;display:inline-block;cursor:pointer">🛒 Pendiente · marcar comprado</span>';
    rows += '</div>';
    rows += '<div class="item-actions">';
    rows += '<button class="ibtn" data-edit="compra" data-eid="' + m.id + '">✏️</button>';
    rows += '<button class="ibtn" data-del="' + key + '" data-did="' + m.id + '">🗑️</button>';
    rows += '</div></div>';
  });
  el.innerHTML = rows;
}

function togglePendiente(key, id) {
  var item = (DB[key]||[]).find(function(m){ return m.id==id; });
  if (!item) return;
  var span = document.querySelector('[data-pkey="' + key + '"][data-pid="' + id + '"]');
  if (span) {
    span.textContent = '✓ Comprado';
    span.style.background = 'var(--green-lt)';
    span.style.color = 'var(--green)';
    span.removeAttribute('data-pkey');
  }
  playSound('check');
  setTimeout(function() {
    item.pendiente = false;
    save();
    renderCompras('cp-med'); renderCompras('cp-aseo'); renderCompras('cp-var');
    renderOverview();
  }, 900);
}

// ═══ BACKUP ═══
function exportarDatos() {
  try {
    var f = new Date();
    var nombre = 'miagenda_' + f.getFullYear() + String(f.getMonth()+1).padStart(2,'0') + String(f.getDate()).padStart(2,'0') + '.json';
    var blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    addBackupHist('export', nombre);
    renderBackupHist();
    toast('✅ Copia exportada: ' + nombre);
  } catch(e) { toast('❌ Error al exportar'); }
}

function importarDatos(event) {
  var file = event.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (typeof data !== 'object' || data === null) throw new Error('Formato inválido');
      // ensure all keys
      var nd = newDB();
      DB = {
        transport: data.transport || nd.transport,
        plantillas: data.plantillas || nd.plantillas,
        noche: data.noche || nd.noche,
        manana: data.manana || nd.manana,
        noche_deleted: data.noche_deleted || [],
        manana_deleted: data.manana_deleted || [],
        eventos: data.eventos || data.examenes || nd.eventos,
        temas: data.temas || nd.temas,
        citas: data.citas || nd.citas,
        medicinas: data.medicinas || nd.medicinas,
        aseo: data.aseo || nd.aseo,
        varios: data.varios || nd.varios,
        notas: data.notas || nd.notas
      };
      save();
      addBackupHist('import', file.name);
      renderBackupHist();
      render(curSec);
      toast('✅ Datos restaurados correctamente');
    } catch(err) {
      toast('❌ Error al importar: archivo no válido');
    }
  };
  reader.onerror = function() { toast('❌ Error al leer el archivo'); };
  reader.readAsText(file);
  event.target.value = '';
}

function addBackupHist(type, filename) {
  try {
    var hist = JSON.parse(localStorage.getItem(BH_KEY) || '[]');
    hist.unshift({type:type, filename:filename, date:new Date().toISOString()});
    if (hist.length > 20) hist.pop();
    localStorage.setItem(BH_KEY, JSON.stringify(hist));
  } catch(e) {}
}

function borrarHistorial() {
  if (!confirm('¿Borrar todo el historial de copias?')) return;
  localStorage.removeItem(BH_KEY);
  renderBackupHist();
  toast('Historial borrado');
}

function renderBackupHist() {
  var el = document.getElementById('backup-hist'); if (!el) return;
  try {
    var hist = JSON.parse(localStorage.getItem(BH_KEY) || '[]');
    if (!hist.length) { el.innerHTML='<div style="text-align:center;padding:16px;color:var(--text3);font-size:13px">Aún no hay copias registradas</div>'; return; }
    var html = '';
    hist.forEach(function(h) {
      var d = new Date(h.date);
      var ds = d.getDate() + ' ' + MONS[d.getMonth()] + ' ' + d.getFullYear();
      var ts = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surf2);border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:7px">';
      html += '<span style="font-size:22px">' + (h.type==='export'?'💾':'📂') + '</span>';
      html += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">' + (h.type==='export'?'Exportación':'Restauración') + '</div>';
      html += '<div style="font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + h.filename + '</div></div>';
      html += '<div style="text-align:right;flex-shrink:0"><div style="font-size:12px;font-weight:600">' + ds + '</div><div style="font-size:11px;color:var(--text3)">' + ts + '</div></div></div>';
    });
    el.innerHTML = html;
  } catch(e) { el.innerHTML = ''; }
}

      + '</select></div>'
      + '<div class="fg"><label class="fl">Notas</label><textarea class="fta" id="f-notas">' + (d?d.notas||'':'') + '</textarea></div>';
  }

  if (type === 'cita') {
    return '<div class="fg"><label class="fl">Especialidad</label><input class="fi" id="f-especialidad" autocomplete="off" value="' + (d?d.especialidad||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">Médico</label><input class="fi" id="f-medico" autocomplete="off" value="' + (d?d.medico||'':'') + '"></div>'
      + '<div class="frow">'
      + '<div class="fg"><label class="fl">Fecha</label><input class="fi" id="f-date" type="date" value="' + (d?d.date||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">Hora</label><input class="fi" id="f-time" type="time" value="' + (d?d.time||'':'') + '"></div>'
      + '</div>'
      + '<div class="fg"><label class="fl">Lugar</label><input class="fi" id="f-lugar" autocomplete="off" value="' + (d?d.lugar||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">Notas</label><textarea class="fta" id="f-notas">' + (d?d.notas||'':'') + '</textarea></div>';
  }

  if (type === 'compra') {
    var activeTab = document.querySelector('#sec-compras .sub-panel.on');
    var pid2 = activeTab ? activeTab.id : 'cp-med';
    var isMed2 = true, isVar2 = false;
    if (mMode === 'edit') {
      isMed2 = !!DB.medicinas.find(function(m){ return m.id==mId; });
      isVar2 = !!(DB.varios||[]).find(function(m){ return m.id==mId; });
    } else {
      isMed2 = (pid2 === 'cp-med');
      isVar2 = (pid2 === 'cp-var');
    }
    var defIco2 = isMed2 ? '💊' : isVar2 ? '🛒' : '🧴';
    var keyStr = isMed2 ? 'medicinas' : isVar2 ? 'varios' : 'aseo';
    return '<div class="frow" style="align-items:flex-end">'
      + '<div class="fg" style="max-width:68px"><label class="fl">Emoji</label><input class="fi" id="f-icon" autocomplete="off" value="' + ((d&&d.icon)||defIco2) + '" style="text-align:center;font-size:22px;padding:8px 4px"></div>'
      + '<div class="fg"><label class="fl">Nombre</label><input class="fi" id="f-nombre" autocomplete="off" value="' + (d?d.nombre||'':'') + '"></div>'
      + '</div>'
      + '<input type="hidden" id="f-compkey" value="' + keyStr + '">'
      + '<div class="fg"><label class="fl">Descripción</label><input class="fi" id="f-dosis" autocomplete="off" value="' + (d?d.dosis||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">Notas</label><input class="fi" id="f-notas2" autocomplete="off" value="' + (d?d.notas||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">¿Pendiente de comprar?</label><select class="fs" id="f-pendiente">'
      + '<option value="0"' + (!d||!d.pendiente?' selected':'') + '>No</option>'
      + '<option value="1"' + (d&&d.pendiente?' selected':'') + '>Sí</option>'
      + '</select></div>';
  }

  if (type === 'nota') {
    return '<div class="fg"><label class="fl">Título</label><input class="fi" id="f-titulo" autocomplete="off" value="' + (d?d.titulo||'':'') + '"></div>'
      + '<div class="fg"><label class="fl">Contenido</label><textarea class="fta" id="f-contenido" style="min-height:140px">' + (d?d.contenido||'':'') + '</textarea></div>'
      + '<div class="fg"><label class="fl">Color</label><select class="fs" id="f-color">'
      + '<option value="blue"' + (!d||d.color==='blue'?' selected':'') + '>🔵 Azul</option>'
      + '<option value="amber"' + (d&&d.color==='amber'?' selected':'') + '>🟡 Amarillo</option>'
      + '<option value="teal"' + (d&&d.color==='teal'?' selected':'') + '>🟢 Verde</option>'
      + '<option value="rose"' + (d&&d.color==='rose'?' selected':'') + '>🔴 Rojo</option>'
      + '<option value="purple"' + (d&&d.color==='purple'?' selected':'') + '>🟣 Morado</option>'
      + '</select></div>';
  }
  return '';
}

function syncEvIcon(cat) { var el=document.getElementById('f-icon'); if(el) el.value=iconForCat(cat); }

function aplicarPlantilla(id) {
  if (!id) return;
  var p = DB.plantillas.find(function(t){ return t.id===id; });
  if (!p) return;
  var set = function(fid, val){ var el=document.getElementById(fid); if(el) el.value=val||''; };
  set('f-label', p.label); set('f-time', p.time); set('f-notas', p.notas);
  var tipo = document.getElementById('f-tipo');
  if (tipo) { for(var i=0;i<tipo.options.length;i++) tipo.options[i].selected = tipo.options[i].value===p.tipo; }
  var precio = document.getElementById('f-precio');
  if (precio) precio.value = p.precio || '';
}

function borrarPlantilla() {
  var sel = document.getElementById('f-plantilla');
  if (!sel || !sel.value) { toast('Selecciona una plantilla para borrar'); return; }
  var id = sel.value;
  var p = DB.plantillas.find(function(t){ return t.id===id; });
  if (!p) return;
  if (!confirm('¿Borrar la plantilla "' + p.label + '"?')) return;
  DB.plantillas = DB.plantillas.filter(function(t){ return t.id!==id; });
  save();
  if (!DB.plantillas.length) {
    var fg = sel.closest('.fg'); if (fg) fg.parentNode.removeChild(fg);
  } else {
    var opts = '<option value="">-- Sin plantilla --</option>';
    DB.plantillas.forEach(function(p2){ opts += '<option value="' + p2.id + '">' + p2.label + '</option>'; });
    sel.innerHTML = opts;
  }
  toast('Plantilla borrada');
}

// ═══ SAVE MODAL ═══
function saveModal() {
  var type = mType, mode = mMode, id = mId;

  function ups(key, obj) {
    if (mode === 'edit') {
      var i = DB[key].findIndex(function(x){ return x.id==id; });
      if (i >= 0) DB[key][i] = obj; else DB[key].push(obj);
    } else DB[key].push(obj);
  }

  if (type === 'transport') {
    var obj = {id:mode==='edit'?id:uid(), label:v('f-label'), date:v('f-date'), time:v('f-time'),
      tipo:v('f-tipo'), precio:v('f-precio'), reservado:v('f-reservado')==='1',
      pagado:v('f-pagado')==='1', notas:v('f-notas')};
    ups('transport', obj);
    var tplCb = document.getElementById('f-tpl');
    if (tplCb && tplCb.checked) {
      DB.plantillas.push({id:uid(), label:obj.label, time:obj.time, tipo:obj.tipo, precio:obj.precio, notas:obj.notas});
    }
  } else if (type === 'checklist' || type === 'checklist_noche' || type === 'checklist_manana') {
    var chkKey = (type === 'checklist_manana' || (type === 'checklist' && curSec === 'manana')) ? 'manana' : 'noche';
    var newObj = {id:mode==='edit'?id:Date.now(), label:v('f-label'), icon:v('f-icon')||'📌', done:false};
    if (mode === 'edit') {
      var idx = DB[chkKey].findIndex(function(n){ return n.id==id; });
      if (idx >= 0) { newObj.done = DB[chkKey][idx].done; DB[chkKey][idx] = newObj; }
      else DB[chkKey].push(newObj);
    } else DB[chkKey].push(newObj);
  } else if (type === 'evento') {
    ups('eventos', {id:mode==='edit'?id:uid(), icon:v('f-icon')||iconForCat(v('f-categoria')||'Otro'),
      nombre:v('f-nombre'), categoria:v('f-categoria'), date:v('f-date'), hora:v('f-hora'),
      lugar:v('f-lugar'), recurrencia:v('f-recurrencia'), notas:v('f-notas')});
  } else if (type === 'tema') {
    ups('temas', {id:mode==='edit'?id:uid(), numero:v('f-numero'), nombre:v('f-nombre'),
      asignatura:v('f-asignatura'), status:v('f-status'), notas:v('f-notas')});
  } else if (type === 'cita') {
    ups('citas', {id:mode==='edit'?id:uid(), especialidad:v('f-especialidad'), medico:v('f-medico'),
      date:v('f-date'), time:v('f-time'), lugar:v('f-lugar'), notas:v('f-notas')});
  } else if (type === 'compra') {
    var ck = v('f-compkey') || 'medicinas';
    var cobj = {id:mode==='edit'?id:uid(), icon:v('f-icon'), nombre:v('f-nombre'),
      dosis:v('f-dosis'), notas:v('f-notas2'), pendiente:v('f-pendiente')==='1'};
    if (mode === 'edit') {
      var im = DB.medicinas.findIndex(function(m){ return m.id==id; });
      var ia = DB.aseo.findIndex(function(a){ return a.id==id; });
      var iv = (DB.varios||[]).findIndex(function(vv){ return vv.id==id; });
      if (im >= 0) DB.medicinas[im] = cobj;
      else if (ia >= 0) DB.aseo[ia] = cobj;
      else if (iv >= 0) DB.varios[iv] = cobj;
      else { if(!DB[ck])DB[ck]=[]; DB[ck].push(cobj); }
    } else { if(!DB[ck])DB[ck]=[]; DB[ck].push(cobj); }
  } else if (type === 'nota') {
    ups('notas', {id:mode==='edit'?id:uid(), titulo:v('f-titulo'), contenido:v('f-contenido'),
      color:v('f-color')||'blue', fecha:new Date().toISOString()});
  }

  playSound('save');
  save();
  closeModal();
  render(curSec);
}

// ═══ GLOBAL CLICK DELEGATOR ═══
document.addEventListener('click', function(e) {
  // Icon grid
  var icoBtn = e.target.closest('.ico-btn');
  if (icoBtn && icoBtn.dataset.ic) {
    var ic = icoBtn.dataset.ic;
    var fi = document.getElementById('f-icon');
    if (fi) fi.value = ic;
    document.querySelectorAll('.ico-btn').forEach(function(b){ b.classList.remove('sel'); });
    icoBtn.classList.add('sel');
    return;
  }
  // Pendiente toggle
  var pspan = e.target.closest('[data-pkey]');
  if (pspan) { togglePendiente(pspan.dataset.pkey, pspan.dataset.pid); return; }
  // Checklist toggle
  var chkEl = e.target.closest('[data-chk]');
  if (chkEl) { toggleChk(chkEl.dataset.chk, chkEl.dataset.cid); return; }
  // Tema status select
  var temaEl = e.target.closest('[data-tema]');
  if (temaEl && temaEl.tagName === 'SELECT') { setTemaStatus(temaEl.dataset.tema, temaEl.value); return; }
  // Edit
  var editBtn = e.target.closest('[data-edit]');
  if (editBtn) { openEdit(editBtn.dataset.edit, editBtn.dataset.eid); return; }
  // Delete
  var delBtn = e.target.closest('[data-del]');
  if (delBtn) { del(delBtn.dataset.del, delBtn.dataset.did); return; }
});

// ═══ EXIT CONTROL ═══
var exitPending = false;
function showExitDialog() { document.getElementById('exitOverlay').style.display = 'flex'; }
function cancelExit() { document.getElementById('exitOverlay').style.display = 'none'; exitPending = false; history.pushState({app:true}, ''); }
function confirmExit() { document.getElementById('exitOverlay').style.display = 'none'; exitPending = true; history.back(); }

window.addEventListener('popstate', function() {
  var appVisible = document.getElementById('app').style.display !== 'none';
  if (appVisible && !exitPending) showExitDialog();
  exitPending = false;
});
</script>
